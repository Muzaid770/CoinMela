<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Mela - Payment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { color: #ffb703; margin-bottom: 10px; }
        .amount-box {
            background-color: #2b2b2b;
            padding: 12px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #2ec4b6;
            margin: 15px 0;
        }
        .qr-card {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            margin: 10px 0;
        }
        .qr-card img {
            width: 220px;
            height: 220px;
            object-fit: contain;
        }
        .details-box {
            background-color: #2b2b2b;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 15px;
            text-align: left;
            line-height: 1.6;
        }
        .details-box strong { color: #ffb703; }
        .btn-pay {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #ffb703;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #ccc; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2b2b2b;
            color: #fff;
            box-sizing: border-box;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #2ec4b6;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .preview-img {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #444;
        }
        .status-box {
            display: none;
            background-color: #2b2b2b;
            padding: 25px 20px;
            border-radius: 10px;
        }
        .timer {
            font-size: 28px;
            font-weight: bold;
            color: #ffb703;
            margin: 15px 0;
        }
        .retry-btn {
            background-color: #e63946;
            color: #fff;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="paymentSection">
        <h2>Complete Payment</h2>
        <p style="color: #bbb; font-size: 14px; margin: 0;">Niche QR Code, UPI ya Bank Details par payment karein:</p>
        
        <div class="amount-box">Total Amount: ₹1377</div>

        <div class="qr-card" id="qrContainer" style="display:none;">
            <img id="qrImage" src="" alt="Admin QR Code">
        </div>

        <a id="payBtn" href="#" class="btn-pay" style="display:none;">Pay via UPI App (GPay/PhonePe/Paytm)</a>

        <div class="details-box">
            <strong>UPI ID:</strong> <span id="dispUpi">Loading...</span><
