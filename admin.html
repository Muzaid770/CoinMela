<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Mela - Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        .card {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2, h3 { color: #ffb703; margin-top: 0; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: #ccc; margin-bottom: 4px; }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2b2b2b;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ffb703;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .user-details {
            background-color: #2b2b2b;
            padding: 12px;
            border-radius: 6px;
            line-height: 1.6;
        }
        .preview-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-top: 10px;
            border: 1px solid #444;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Admin Panel Control</h2>

    <!-- Payment Settings Control -->
    <div class="card">
        <h3>Update Payment Details</h3>
        
        <div class="form-group">
            <label>QR Code Photo Select Karein (Upload):</label>
            <input type="file" id="adminQrFile" accept="image/*" onchange="previewAndConvertQR(event)">
            <br>
            <img id="qrPreview" class="preview-img" src="" alt="QR Preview" style="display:none;">
        </div>

        <div class="form-group">
            <label>UPI ID:</label>
            <input type="text" id="adminUpi" placeholder="e.g. 9876543210@paytm">
        </div>
        <div class="form-group">
            <label>Account Holder Name:</label>
            <input type="text" id="adminAccName" placeholder="Account Name">
        </div>
        <div class="form-group">
            <label>Account Number:</label>
            <input type="text" id="adminAccNo" placeholder="Account Number">
        </div>
        <div class="form-group">
            <label>IFSC Code:</label>
            <input type="text" id="adminIfsc" placeholder="IFSC Code">
        </div>
        <div class="form-group">
            <label>Bank Name:</label>
            <input type="text" id="adminBank" placeholder="Bank Name">
        </div>
        <button onclick="savePaymentSettings()">Save Payment Details</button>
    </div>

    <!-- Submitted Users List -->
    <div class="card">
        <h3>Recent Submissions</h3>
        <div class="user-details" id="submissionData">
            Loading submission...
        </div>
    </div>
</div>

<script>
let qrBase64Data = "";

window.onload = function() {
    document.getElementById('adminUpi').value = localStorage.getItem('paymentUpi') || '';
    document.getElementById('adminAccName').value = localStorage.getItem('paymentAccName') || '';
    document.getElementById('adminAccNo').value = localStorage.getItem('paymentAccNo') || '';
    document.getElementById('adminIfsc').value = localStorage.getItem('paymentIfsc') || '';
    document.getElementById('adminBank').value = localStorage.getItem('paymentBank') || '';

    qrBase64Data = localStorage.getItem('paymentQrImg') || '';
    if (qrBase64Data) {
        const img = document.getElementById('qrPreview');
        img.src = qrBase64Data;
        img.style.display = 'block';
    }

    const name = localStorage.getItem('userName') || 'N/A';
    const mobile = localStorage.getItem('userMobile') || 'N/A';
    const utr = localStorage.getItem('userUTR') || 'Pending';

    document.getElementById('submissionData').innerHTML = `
        <strong>Name:</strong> ${name}<br>
        <strong>Mobile:</strong> ${mobile}<br>
        <strong>Amount:</strong> ₹1377<br>
        <strong>UTR/Txn ID:</strong> <span style="color:#2ec4b6">${utr}</span>
    `;
};

function previewAndConvertQR(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            qrBase64Data = e.target.result;
            const img = document.getElementById('qrPreview');
            img.src = qrBase64Data;
            img.style.display = 'block';
        };
        reader.readAsDataURL(file);
    }
}

function savePaymentSettings() {
    localStorage.setItem('paymentUpi', document.getElementById('adminUpi').value);
    localStorage.setItem('paymentAccName', document.getElementById('adminAccName').value);
    localStorage.setItem('paymentAccNo', document.getElementById('adminAccNo').value);
    localStorage.setItem('paymentIfsc', document.getElementById('adminIfsc').value);
    localStorage.setItem('paymentBank', document.getElementById('adminBank').value);
    
    if (qrBase64Data) {
        localStorage.setItem('paymentQrImg', qrBase64Data);
    }

    alert('Payment Details & QR Code Successfully Updated!');
}
</script>

</body>
</html>
