<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Mela - Payment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { color: #ffb703; margin-bottom: 10px; }
        .amount-box {
            background-color: #2b2b2b;
            padding: 12px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #2ec4b6;
            margin: 15px 0;
        }
        .qr-card {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            margin: 10px 0;
        }
        .qr-card img {
            width: 220px;
            height: 220px;
            object-fit: contain;
        }
        .details-box {
            background-color: #2b2b2b;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 15px;
            text-align: left;
            line-height: 1.6;
        }
        .details-box strong { color: #ffb703; }
        .btn-pay {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #ffb703;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #ccc; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2b2b2b;
            color: #fff;
            box-sizing: border-box;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #2ec4b6;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Complete Payment</h2>
    <p style="color: #bbb; font-size: 14px; margin: 0;">Niche QR Code, UPI ya Bank Details par payment karein:</p>
    
    <div class="amount-box">Total Amount: ₹1377</div>

    <!-- Dynamic Admin QR Code Image -->
    <div class="qr-card" id="qrContainer" style="display:none;">
        <img id="qrImage" src="" alt="Admin QR Code">
    </div>

    <!-- Direct App Pay Button -->
    <a id="payBtn" href="#" class="btn-pay" style="display:none;">Pay via UPI App (GPay/PhonePe/Paytm)</a>

    <!-- Dynamic Account & UPI Details Box -->
    <div class="details-box">
        <strong>UPI ID:</strong> <span id="dispUpi">Loading...</span><br>
        <hr style="border: 0.2px solid #444; margin: 8px 0;">
        <strong>Account Holder:</strong> <span id="dispAccName">Loading...</span><br>
        <strong>Account Number:</strong> <span id="dispAccNo">Loading...</span><br>
        <strong>IFSC Code:</strong> <span id="dispIfsc">Loading...</span><br>
        <strong>Bank Name:</strong> <span id="dispBank">Loading...</span>
    </div>

    <!-- Transaction Submission Form -->
    <form onsubmit="submitTransaction(event)">
        <div class="form-group">
            <label>Payment Ke Baad UTR / Transaction ID Daalein:</label>
            <input type="text" id="utr" placeholder="12-digit UTR / Reference No." required>
        </div>
        <button type="submit">Submit Payment Details</button>
    </form>
</div>

<script>
window.onload = function() {
    // Read data saved from Admin Panel
    const upi = localStorage.getItem('paymentUpi') || 'Not Set';
    const accName = localStorage.getItem('paymentAccName') || 'Not Set';
    const accNo = localStorage.getItem('paymentAccNo') || 'Not Set';
    const ifsc = localStorage.getItem('paymentIfsc') || 'Not Set';
    const bank = localStorage.getItem('paymentBank') || 'Not Set';
    const qrImg = localStorage.getItem('paymentQrImg') || '';

    // Update Text Details
    document.getElementById('dispUpi').innerText = upi;
    document.getElementById('dispAccName').innerText = accName;
    document.getElementById('dispAccNo').innerText = accNo;
    document.getElementById('dispIfsc').innerText = ifsc;
    document.getElementById('dispBank').innerText = bank;

    // Show Uploaded QR Image if available
    if (qrImg) {
        document.getElementById('qrImage').src = qrImg;
        document.getElementById('qrContainer').style.display = 'inline-block';
    }

    // Direct UPI Link Setup
    if (upi !== 'Not Set') {
        const upiLink = `upi://pay?pa=${upi}&pn=CoinMela&am=1377`;
        const payBtn = document.getElementById('payBtn');
        payBtn.href = upiLink;
        payBtn.style.display = 'block';
    }
};

function submitTransaction(e) {
    e.preventDefault();
    const utr = document.getElementById('utr').value;
    localStorage.setItem('userUTR', utr);
    alert('Aapka payment details submit ho gaya hai! Admin approval ke liye wait karein.');
    window.location.href = 'admin.html';
}
</script>

</body>
</html>
